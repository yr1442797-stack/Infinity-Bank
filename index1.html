<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>scaner</title>
  <style>
   /* ================================
   BASIC RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ================================
   BODY
================================ */

body {
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            rgba(0, 0, 0, 0.55),
            rgba(0, 0, 0, 0.55)
        ),
        url("https://t4.ftcdn.net/jpg/03/10/16/27/360_F_310162798_6hWbaSFgDtWp4AhhaKPlTgAZUDL1c4UY.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* ================================
   HEADER
================================ */

header {
    width: 100%;
    padding: 25px;

    text-align: center;

    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

header h1 {
    color: white;

    font-size: 42px;
    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.5);
}


/* ================================
   MAIN
================================ */

main {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 60px 20px;
}


/* ================================
   SCANNER BOX
================================ */

.box {

    width: 350px;

    padding: 30px;

    background: rgba(255, 255, 255, 0.92);

    border: 2px solid rgba(255, 255, 255, 0.5);

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);

    transition: 0.4s ease;
}


/* Hover Effect */

.box:hover {

    transform: translateY(-10px);

    box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.45);
}


/* ================================
   QR CODE
================================ */

.box p {

    margin-bottom: 25px;
}


.box img {

    width: 230px;
    height: 230px;

    object-fit: contain;

    padding: 12px;

    background: white;

    border-radius: 15px;

    border: 3px solid #222;

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.2);

    transition: 0.3s;
}


/* QR Hover */

.box img:hover {

    transform: scale(1.05);

    border-color: #2563eb;
}


/* ================================
   SUBMIT BUTTON
================================ */

input[type="button"] {

    position: static;

    width: 180px;
    height: 48px;

    border: none;

    border-radius: 25px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color: white;

    font-size: 16px;
    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.35);

    transition: 0.3s ease;
}


/* Button Hover */

input[type="button"]:hover {

    transform: translateY(-3px);

    box-shadow:
        0 12px 25px rgba(37, 99, 235, 0.5);

    background: linear-gradient(
        135deg,
        #1d4ed8,
        #6d28d9
    );
}


/* Button Click */

input[type="button"]:active {

    transform: scale(0.96);
}


/* ================================
   RESPONSIVE DESIGN
================================ */

@media (max-width: 600px) {

    header h1 {
        font-size: 30px;
    }

    .box {

        width: 90%;

        padding: 25px;
    }

    .box img {

        width: 200px;
        height: 200px;
    }

    input[type="button"] {

        width: 160px;
    }
}
  </style>
</head>

<body>
  <header>
    <h1>
        scaner
      </h1>
  
  </header>
  <br><br>
  <main>
      <div class="box">
      
      <p><img src="qrcode_chrome (1).png" alt="scaner"></p>
      <a href="index.html"><input type="button" value="Submit"></a>
    </div>
  </main>
</body>

</html>
